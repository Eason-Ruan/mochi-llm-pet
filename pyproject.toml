[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpet"
version = "0.1.0"
description = "An LLM-driven virtual pet that lives on the Windows desktop"
requires-python = ">=3.11"
dependencies = [
    "mss==9.0.1",
    "Pillow==10.4.0",
    "httpx==0.27.2",
    "httpcore==1.0.9",
    "anthropic==0.39.0",
    "openai==1.109.1",
    "keyring==25.6.0",
    "pydantic==2.14.4",
    "deepseek-harness-sdk==0.2.2rc2 ; (sys_platform == 'darwin' and (platform_machine == 'arm64' or platform_machine == 'x86_64')) or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
    "tenacity==9.0.0",
    "PyYAML==6.0.2",
    "psutil==6.0.0",
    "PyQt6==6.10.0 ; sys_platform == 'win32' or sys_platform == 'darwin'",
    "tzdata ; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10,<12 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10,<12 ; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=10,<12 ; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=10,<12 ; sys_platform == 'darwin'",
    "pywin32==306 ; sys_platform == 'win32'",
    "uiautomation==2.0.20 ; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom==3.2.1 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1 ; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications==3.2.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "respx==0.21.1"]

[project.scripts]
deskpet = "deskpet.__main__:main"

[tool.setuptools.packages.find]
include = ["deskpet*"]

[tool.setuptools.package-data]
"deskpet.system2" = ["dsh_bridge.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
